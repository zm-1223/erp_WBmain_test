[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short --alluredir=reports/allure-results -p no:xdist --log-cli-level=INFO
log_cli = true
log_cli_level = INFO
markers =
    p0: 冒烟/阻断级
    p1: 重要功能
    p2: 次要/非必填
    need_goods: 精选列表有货时才执行
    flaky: 失败后按 reruns/reruns_delay 重试
    no_browser: 不启动 session Chrome（解析单测等）
filterwarnings =
    ignore::DeprecationWarning
